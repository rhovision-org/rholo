[package]
name = "rchain-node"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful and hardened Rust port of the RChain node module (glue: configuration, runtime, API)."

[dependencies]
async-trait = "0.1"
axum = "0.8"
# `string` is what lets `version = …` take the *computed* version string: clap's `Str` is a
# `&'static str` by default, and the provenance commit is not known until the build script runs
# (issue #32). Without it the only routes are leaking a `String` or leaving `--version` reporting a
# bare version number while `/version` reports the commit.
clap = { version = "4", features = ["derive", "string"] }
futures-util = "0.3"
hocon = { version = "0.9", default-features = false }
linked-hash-map = "0.5"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = { version = "19", features = ["derive"] }
rchain-block-storage = { path = "../block-storage" }
rchain-casper = { path = "../casper" }
rchain-comm = { path = "../comm" }
rchain-crypto = { path = "../crypto" }
rchain-models = { path = "../models" }
rchain-ocapn = { path = "../ocapn" }
rchain-rholang = { path = "../rholang" }
rchain-rspace = { path = "../rspace" }
rchain-sdk = { path = "../sdk" }
rchain-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.7", features = ["cors", "timeout"] }
# Heap profiling (#117), off by default. The allocator and the profiler are wired in `src/main.rs`
# only — the *bin*, not the lib — so `cargo test --all-features` (which `make test-*` uses) compiles
# the dependency without installing a profiling global allocator in any test harness.
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]
# The jemalloc sampler, for the heap dump that named #117's live structure. **Off by default, and it has
# to be**: `tikv-jemalloc-sys` passes `--enable-prof` only under this feature, so it is what puts a
# sampled stack unwinding (one per 2^lg_prof_sample allocations) on every allocation *and* makes the
# sampled allocations unpurgeable — a confound in exactly the measurements #117 rests on. It was on by
# default for one commit, and this is the correction.
#
# A profiling build is reproducible from the tree without changing any default:
#
#   JEMALLOC_SYS_WITH_MALLOC_CONF='background_thread:true,dirty_decay_ms:0,muzzy_decay_ms:0,retain:false,stats_print:true,stats_print_opts:g,prof:true,lg_prof_sample:20,prof_prefix:/var/lib/rnode/jeprof' \
#   RNODE_BUILD_MALLOC_CONF="$JEMALLOC_SYS_WITH_MALLOC_CONF" \
#   RNODE_BUILD_FEATURES=jemalloc-profiling \
#   RNODE_BUILD_RUSTFLAGS='-C debuginfo=1 -C link-arg=-Wl,--export-dynamic' \
#     tools/devnet.sh build
#
# (`JEMALLOC_SYS_WITH_MALLOC_CONF` is read by the sys crate's build script, so a shell value beats the
# `[env]` default in `.cargo/config.toml` — which is the hook this uses, and why the profiling keys are
# not baked there. `--export-dynamic` is what lets the shim reach `mallctl` at runtime; `debuginfo=1` is
# what makes the dump nameable.)
#
# **`--all-features` enables it**, because that is what `--all-features` means — CI, `make`, coverage and
# nightly compile it in. It is then inert: the sampler is present but `prof:true` is not in the compiled
# configuration, so it neither samples nor dumps. The cost is build time, and it is the price of an
# opt-in that does not need an out-of-workspace manifest.
jemalloc-profiling = ["tikv-jemallocator/profiling"]

[target.'cfg(unix)'.dependencies]
# `statvfs` for the data-directory free-space fact (A1). Safe API; the crate graph stays
# `#![forbid(unsafe_code)]`. `nix` was already in the lock via `rustyline`.
nix = { version = "0.31", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The node's allocator on Linux: jemalloc, with the background purge thread configured in `src/main.rs`.
# See the comment on the `#[global_allocator]` there — this is the bound on #117, where glibc's per-thread
# arena retention let a node reach its cgroup ceiling with a live heap in the tens of MiB.
#
# `stats` is what makes the allocator able to answer the question #117 turned on, and it is not optional
# decoration: `tikv-jemalloc-sys` passes `--enable-stats` **only** when this feature is on, so without it
# jemalloc silently has no accounting at all — `stats_print:true` prints its configuration echo and then
# no numbers, and `stats.allocated` does not exist to be read. That is how two profiling attempts failed
# with a *plausible-looking* absence of data rather than an error: `prof:true` is likewise ignored here
# (the `profiling` feature would be needed, and it is deliberately not enabled — see below), so an
# instrument that was never compiled in was read as an instrument that caught nothing. With `stats` on,
# `MALLOC_CONF=stats_print:true,stats_print_opts:g` reports `Allocated` (live), `active`, `metadata`,
# `resident`, `mapped` and `retained` at exit, which is the live-versus-held split no other instrument in
# the tree can produce.
#
# `profiling` is **not** enabled here: it is the `jemalloc-profiling` feature above, opt-in, because a
# default build must not pay a sampled unwinding per allocation nor hold sampled allocations unpurgeable.
# When it is wanted it is the *light* instrument for the job — one unwind per 2^lg_prof_sample
# allocations where `dhat` instruments every one — and the dump is triggered by `prof.dump` from the shim
# the moment the node's cgroup passes a threshold, which is the only way to read the live set *at* the
# ceiling: jemalloc's `prof_final` and `stats_print` both write at exit, after the node has freed its
# world.
tikv-jemallocator = { version = "0.7", features = ["stats"] }

[dev-dependencies]

[[bin]]
name = "rnode"
path = "src/main.rs"
