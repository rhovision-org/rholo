[package]
name = "rchain-block-storage"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful and hardened Rust port of the RChain block-storage module (DAG finalizer/estimator)."

[dependencies]
async-trait = "0.1"
lz4_flex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
rchain-crypto = { path = "../crypto" }
rchain-models = { path = "../models" }
rchain-sdk = { path = "../sdk" }
rchain-shared = { path = "../shared" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# The property sweep (Laws 15/18). Already in `Cargo.lock` — a dev-dependency addition, not a new
# external dependency.
proptest = "1"
