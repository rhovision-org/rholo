# Nightly devnet fuzz — robustness, input guards and the scheduler modes, over a real Docker network.
# The schedule also runs the source-pinned N4/N8 quiet-chain and recovery gates.
# These jobs use disposable Docker networks; manual mode selection stays independent.
#
# **Nothing here gates a pull request.** It needs Docker, a built image and a live network, so it runs
# on a schedule (and on demand) rather than on every push: a flaky network harness in the PR path
# would be worse than the coverage it adds. The in-process suites (`casper/tests/scheduler.rs`,
# `rholang/tests/execution.rs`, `casper/tests/gateway*.rs`) are what gate a PR.
#
# Each mode asserts something different, and the mode selection is a workflow input so a manual run
# can sweep one of them:
#
#   valid      3 validators stay in lock-step under a valid-term + signed-deploy fuzz
#   malformed  the input guards (truncation, spliced delimiters, deep nesting past MAX_PARSE_DEPTH,
#              huge integers, non-UTF-8 bytes) all answer 4xx, never 5xx, never wedge a node
#   scheduler  the corpus reduces under the configured `--effect-scheduler` mode
#   gateway    a single-shard devnet reports one shard and does not serve the txn routes

name: devnet fuzz (nightly)

on:
  schedule:
    # Off the :00 mark: every scheduler in the fleet lands on the hour, and a nightly job has no
    # reason to join them.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      effect_scheduler:
        description: "effect-scheduler mode for the devnet (dfs, gate, relaxed-validated, relaxed)"
        default: "dfs"
      mode:
        description: "fuzz modes (valid, malformed, scheduler, gateway, all) or pr373-proof"
        default: "all"
      recovery_case:
        description: "Recovery campaign subset: all, lfs, n4, n8 (retains independent verdicts)"
        default: "all"
      iterations:
        description: "explore-deploy iterations for the valid mode"
        default: "100"

permissions:
  contents: read

concurrency:
  group: devnet-fuzz-${{ github.ref }}-${{ github.event.inputs.mode }}
  cancel-in-progress: false

jobs:
  n457-proof-binary:
    if: ${{ github.event.inputs.mode == 'n457-proof-binary' }}
    name: Source-pinned fresh-join regressions and native proof binary
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - name: Install pinned compiler and native dependencies
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev libssl-dev pkg-config build-essential
      - name: Exercise requester and state-restore regressions
        run: |
          set -euo pipefail
          mkdir -p target/n457-proof
          git rev-parse HEAD > target/n457-proof/source-sha.txt
          cargo test --locked -p rchain-casper --lib engine::lfs_block_requester -- --nocapture 2>&1 | tee target/n457-proof/requester-tests.log
          cargo test --locked -p rchain-casper --lib engine::node_syncing -- --nocapture 2>&1 | tee target/n457-proof/restore-tests.log
      - name: Build native Linux proof binary
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          cargo build --locked --release -p rchain-node --bin rnode
          cp target/release/rnode target/n457-proof/rnode
          (cd target/n457-proof && sha256sum rnode > SHA256SUMS)
          target/n457-proof/rnode --version > target/n457-proof/version.txt
          grep -F "$(git rev-parse HEAD)" target/n457-proof/version.txt
          ldd target/n457-proof/rnode > target/n457-proof/ldd.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: n457-native-proof-${{ github.run_id }}
          path: target/n457-proof/
          retention-days: 14
          if-no-files-found: error

  fuzz:
    if: ${{ github.event.inputs.mode != 'pr373-proof' && github.event.inputs.mode != 'pr373-proof-rust' && github.event.inputs.mode != 'final-gap' && github.event.inputs.mode != 'final-gap-rust' && github.event.inputs.mode != 'final-gap-nodes' && github.event.inputs.mode != 'final-gap-recovery' && github.event.inputs.mode != 'quiet-gap' && github.event.inputs.mode != 'quiet-seeded' && github.event.inputs.mode != 'issue447-n4' && github.event.inputs.mode != 'issue447-conflict' && github.event.inputs.mode != 'issue447-registry' && github.event.inputs.mode != 'issue447-rcash' && github.event.inputs.mode != 'issue457-inbound' && github.event.inputs.mode != 'n457-proof-binary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # Inputs are empty on a scheduled run, so fall back to the defaults.
      EFFECT_SCHEDULER: ${{ github.event.inputs.effect_scheduler || 'dfs' }}
      FUZZ_MODE: ${{ github.event.inputs.mode || 'all' }}
      # Hosted runner: the LFS operator-anchor arm needs HTTP on validators,
      # not published gRPC. Avoid conflicts with host services on 42402.
      DEVNET_SKIP_JOINER_GRPC_PUBLISH: ${{ github.event.inputs.mode == 'lfs-history-anchored' && '1' || '0' }}
      ITERATIONS: ${{ github.event.inputs.iterations || '100' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Build the node image
        run: tools/devnet.sh build

      - name: Start the devnet
        run: |
          if [[ "$FUZZ_MODE" == "lfs-history" ]]; then
            tools/devnet.sh up --validators 3 --stakes 1000,100,100 --epoch-length 10 --effect-scheduler "$EFFECT_SCHEDULER"
          elif [[ "$FUZZ_MODE" == "lfs-history-anchored" ]]; then
            tools/devnet.sh up --validators 3 --stakes 1000,100,100 --epoch-length 10 --no-autopropose --effect-scheduler "$EFFECT_SCHEDULER"
          elif [[ "$FUZZ_MODE" == "lfs-history-controlled" ]]; then
            tools/devnet.sh up --validators 3 --stakes 1000,100,100 --epoch-length 10 --no-autopropose --effect-scheduler "$EFFECT_SCHEDULER"
          else
            tools/devnet.sh up --validators 3 --effect-scheduler "$EFFECT_SCHEDULER"
          fi

      - name: Fuzz
        run: |
          python3 tools/devnet-fuzz.py \
            --validators 3 \
            --iterations "$ITERATIONS" \
            --mode "$FUZZ_MODE"

      - name: Retain state-history and checkpoint evidence
        if: always() && (env.FUZZ_MODE == 'lfs-history' || env.FUZZ_MODE == 'lfs-history-controlled' || env.FUZZ_MODE == 'lfs-history-anchored')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lfs-history-${{ github.run_id }}
          path: |
            target/lfs-history-evidence/
            target/lfs-anchor-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Dump the devnet state on failure
        if: failure()
        run: |
          tools/devnet.sh status || true
          tools/devnet.sh diagnose || true
          for node in devnet-bootstrap devnet-validator-1 devnet-validator-2; do
            docker logs --tail 200 "$node" 2>&1 || true
          done

      - name: Tear the devnet down
        if: always()
        run: tools/devnet.sh down -v || true

  issue457-inbound:
    if: ${{ github.event.inputs.mode == 'issue457-inbound' }}
    name: Issue 457 asymmetric inbound reachability and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      DEVNET_SKIP_JOINER_GRPC_PUBLISH: "1"
      DEVNET_NODE_MEMORY: "2g"
      DEVNET_THREAD_POOL_SIZE: "2"
      # The joiner is a passive replica; the test does not require it to propose.
      DEVNET_RESET_PASSIVE: "1"
      DEVNET_PREFIX: n457reach
      DEVNET_NETWORK: n457-reachability
      DEVNET_GRPC_BASE: "55402"
      DEVNET_HTTP_BASE: "55403"
      DEVNET_ADMIN_BASE: "55405"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate the independent fault-injection predicates
        run: |
          set -euo pipefail
          mkdir -p target/issue457
          git rev-parse HEAD > target/issue457/source.txt
          python3 -m unittest discover -s tests -p 'test_n457_asymmetric.py' -v 2>&1 | tee target/issue457/unit.log
          command -v nsenter
          command -v iptables
      - name: Build pinned Docker node
        run: |
          set -euo pipefail
          tools/devnet.sh build
          docker image inspect rnode:local > target/issue457/image.json
      - name: Run blocked-inbound and full-reachability controls
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p target/issue457/{blocked,open}
          tools/devnet.sh up --validators 4 --fresh > target/issue457/start.log 2>&1
          started=$?
          if [ "$started" -ne 0 ]; then
            echo "setup=$started" | tee target/issue457/verdicts.txt
            exit "$started"
          fi
          # Run the fully reachable arm first, before the chain grows under
          # continued auto-proposing during the negative reply-blackout window.
          python3 tools/n457-mature-join-arm.py \
            --min-height 28 --timeout 420 --out target/issue457/open \
            > target/issue457/open/run.log 2>&1
          open=$?
          docker logs n457reach-validator-3 \
            > target/issue457/open/joiner.log 2>&1 || true
          if grep -Eq 'active-bonds leaf not found|block receiver state full' \
              target/issue457/open/joiner.log; then
            echo 'FAIL: successful join was followed by a state/receiver error' \
              >> target/issue457/open/run.log
            open=1
          fi
          # The next reset discards only the joiner's store and network
          # namespace. Surviving validators remain on their original volumes.
          python3 tools/n457-asymmetric-inbound.py \
            --min-height 28 --mature-timeout 240 --negative-timeout 180 \
            --out target/issue457/blocked \
            > target/issue457/blocked/run.log 2>&1
          blocked=$?
          printf 'inbound_reply_loss=%s\nfull_reachability=%s\n' "$blocked" "$open" \
            | tee target/issue457/verdicts.txt
          if [ "$blocked" -ne 0 ] || [ "$open" -ne 0 ]; then
            exit 1
          fi
      - name: Preserve source-pinned witness and node logs
        if: always()
        run: |
          mkdir -p target/issue457
          docker ps -a --filter "name=n457reach" > target/issue457/containers.txt || true
          for node in n457reach-bootstrap n457reach-validator-1 n457reach-validator-2 n457reach-validator-3; do
            docker logs "$node" > "target/issue457/$node.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue457-asymmetric-${{ github.run_id }}
          path: target/issue457/
          if-no-files-found: error
          retention-days: 14
      - name: Remove only the disposable fault-injection devnet
        if: always()
        run: |
          tools/devnet.sh down -v || true

  issue447-n4:
    if: ${{ github.event.inputs.mode == 'issue447-n4' }}
    name: Issue 447 four-validator divergent-tip merge
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      DEVNET_PREFIX: n420fork
      DEVNET_NETWORK: n447-disposable
      DEVNET_NODE_MEMORY: 2g
      DEVNET_SKIP_JOINER_GRPC_PUBLISH: "1"
      DEVNET_WAIT_TRIES: "180"
    steps:
      - name: Checkout exact acceptance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source and runner inventory
        run: |
          mkdir -p target/issue447
          git rev-parse HEAD | tee target/issue447/source.sha
          free -m | tee target/issue447/runner-memory.txt
          docker info --format '{{.ServerVersion}}' | tee target/issue447/docker-version.txt
          python3 -m unittest discover -s tests -p 'test_n447_*.py' -v 2>&1 | tee target/issue447/unit-tests.log
      - name: Build source-pinned real node image
        run: |
          set -euo pipefail
          tools/devnet.sh build 2>&1 | tee target/issue447/build.log
          docker image inspect rnode:local --format '{{.Id}}' | tee target/issue447/image-id.txt
      - name: Start a fresh isolated four-validator network
        run: |
          set -euo pipefail
          tools/devnet.sh up --validators 4 --fresh --no-autopropose --epoch-length 10 2>&1 | tee target/issue447/startup.log
      - name: Verify divergent-tip gossip and application-state merge
        run: |
          set -euo pipefail
          timeout --preserve-status 1000s python3 tools/n420-fork-point.py             --out target/issue447/fork-point --timeout 480 --gossip-timeout 120             2>&1 | tee target/issue447/fork-point.log
      - name: Preserve verdict and diagnostics
        if: always()
        run: |
          mkdir -p target/issue447
          echo "source=$(git rev-parse HEAD)" | tee target/issue447/verdict.txt
          docker ps -a --no-trunc --filter "name=n420fork" 2>&1 | tee target/issue447/containers.txt || true
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}' 2>&1             | tee target/issue447/docker-stats.txt || true
          for name in n420fork-bootstrap n420fork-validator-1 n420fork-validator-2 n420fork-validator-3; do
            docker logs --tail 600 "$name" > "target/issue447/${name}-stdout.log" 2>&1 || true
          done
      - name: Upload raw four-node acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue447-n4-${{ github.run_id }}
          path: target/issue447/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown only the disposable campaign
        if: always()
        run: |
          DEVNET_PREFIX=n420fork DEVNET_NETWORK=n447-disposable tools/devnet.sh down -v || true
  issue447-registry:
    if: ${{ github.event.inputs.mode == 'issue447-registry' }}
    name: Issue 447 registry pinned-state read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEVNET_PREFIX: n447registry
      DEVNET_NETWORK: n447-registry-disposable
      DEVNET_NODE_MEMORY: 2g
      DEVNET_WAIT_TRIES: "180"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source and probe regressions
        run: |
          mkdir -p target/issue447-registry
          git rev-parse HEAD > target/issue447-registry/source.sha
          python3 -m unittest discover -s tests -p 'test_n447_registry.py' -v             2>&1 | tee target/issue447-registry/unit.log
      - name: Build exact source node image
        run: |
          set -euo pipefail
          tools/devnet.sh build 2>&1 | tee target/issue447-registry/build.log
          docker image inspect rnode:local --format '{{.Id}}' > target/issue447-registry/image-id.txt
      - name: Start fresh disposable registry chain
        run: |
          set -euo pipefail
          tools/devnet.sh up --validators 1 --fresh --no-autopropose             --epoch-length 10 2>&1 | tee target/issue447-registry/startup.log
      - name: Probe native registry at identical pinned block roots
        run: |
          set -euo pipefail
          timeout --preserve-status 240s python3 tools/n447-registry-pinned.py             --out target/issue447-registry/registry.json --timeout 150             2>&1 | tee target/issue447-registry/registry.log
      - name: Capture local node diagnostics
        if: always()
        run: |
          docker ps -a --filter "name=n447registry" > target/issue447-registry/containers.txt || true
          docker logs --tail 550 n447registry-bootstrap             > target/issue447-registry/node.log 2>&1 || true
      - name: Preserve pinned read evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue447-registry-${{ github.run_id }}
          path: target/issue447-registry/
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down isolated devnet only
        if: always()
        run: tools/devnet.sh down -v || true

  issue447-conflict:
    if: ${{ github.event.inputs.mode == 'issue447-conflict' }}
    name: Issue 447 real four-validator same-channel conflict
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      DEVNET_PREFIX: n447conflict
      DEVNET_NETWORK: n447-conflict-disposable
      DEVNET_NODE_MEMORY: 3g
      DEVNET_SKIP_JOINER_GRPC_PUBLISH: "1"
      DEVNET_WAIT_TRIES: "180"
    steps:
      - name: Checkout exact merge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source provenance and negative verdict controls
        run: |
          mkdir -p target/issue447-conflict
          git rev-parse HEAD | tee target/issue447-conflict/source.sha
          python3 -m unittest discover -s tests -p 'test_n447_conflict.py' -v             2>&1 | tee target/issue447-conflict/regressions.log
      - name: Build real Docker node
        run: |
          set -euo pipefail
          tools/devnet.sh build 2>&1 | tee target/issue447-conflict/build.log
          docker image inspect rnode:local --format '{{.Id}}' > target/issue447-conflict/image-id.txt
      - name: Start isolated four-validator genesis
        run: |
          set -euo pipefail
          tools/devnet.sh up --validators 4 --fresh --no-autopropose --no-propose-on-deploy --epoch-length 10 2>&1 | tee target/issue447-conflict/startup.log
      - name: Execute conflicting linear-cell updates across 2+2
        run: |
          set -euo pipefail
          verdict=0
          seen=""
          for trial in 1 2 3 4 5 6 7 8; do
            case_dir="target/issue447-conflict/trial-$trial"
            mkdir -p "$case_dir"
            if [[ "$trial" != 1 ]]; then
              tools/devnet.sh down -v
              tools/devnet.sh up --validators 4 --fresh --no-autopropose --no-propose-on-deploy --epoch-length 10 2>&1 | tee "$case_dir/startup.log"
            fi
            options=(--costlier-writer A)
            if (( trial % 2 == 0 )); then options=(--costlier-writer B --swap-writers); fi
            if timeout --preserve-status 1800s python3 tools/n447-same-channel.py "${options[@]}" --out "$case_dir/conflict.json" --timeout 420 2>&1 | tee "$case_dir/conflict.log"; then
              :
            else
              verdict=1
            fi
            for node in n447conflict-bootstrap n447conflict-validator-1 n447conflict-validator-2 n447conflict-validator-3; do
              docker logs "$node" > "$case_dir/$node.log" 2>&1 || true
            done
            if (( verdict != 0 )); then break; fi
            winner=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(s["value"]["survivor"] for s in d["steps"] if s["stage"] == "winner"))' "$case_dir/conflict.json")
            seen="$seen$winner"
            if [[ "$seen" == *A* && "$seen" == *B* ]]; then break; fi
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("target/issue447-conflict")
          observed = set()
          files = sorted(root.glob("trial-*/conflict.json"))
          assert files, "no completed trial evidence"
          for path in files:
              result = json.loads(path.read_text())
              assert result["result"] == "PASS", path
              observed.add(next(s["value"]["survivor"] for s in result["steps"] if s["stage"] == "winner"))
              for log in path.parent.glob("n447conflict-*.log"):
                  content = log.read_text(errors="replace")
                  assert not any(s in content for s in ("I1 VIOLATED", "I2 VIOLATED", "panicked at")), log
          assert observed == {"A", "B"}, "bounded campaign did not cover both winners"
          (root / "coverage.json").write_text(json.dumps({"result": "PASS", "trials": len(files), "winners": sorted(observed)}, indent=2))
          PY
          exit "$verdict"
      - name: Capture node diagnostics
        if: always()
        run: |
          docker ps -a --filter "name=n447conflict" > target/issue447-conflict/containers.txt || true
          for node in n447conflict-bootstrap n447conflict-validator-1 n447conflict-validator-2 n447conflict-validator-3; do
            docker logs --tail 450 "$node" > "target/issue447-conflict/$node.log" 2>&1 || true
          done
      - name: Preserve raw conflict verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue447-conflict-${{ github.run_id }}
          path: target/issue447-conflict/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown disposable conflict network
        if: always()
        run: |
          DEVNET_PREFIX=n447conflict DEVNET_NETWORK=n447-conflict-disposable tools/devnet.sh down -v || true

  issue447-rcash:
    if: ${{ github.event.inputs.mode == 'issue447-rcash' }}
    name: Issue 447 exact-r-cash verified 17-step installer
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      DEVNET_PREFIX: rcash447
      DEVNET_NETWORK: rcash447-disposable
      DEVNET_NODE_MEMORY: 6g
      DEVNET_THREAD_POOL_SIZE: "2"
      APP_DIR: /tmp/rcash-447
      APP_COMMIT: 0c1cc6e4b2c72fb80aeaae51ec92a2749b9a50a4
    steps:
      - name: Check out exact node source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record node source and offline acceptance controls
        run: |
          mkdir -p target/issue447-rcash
          git rev-parse HEAD > target/issue447-rcash/node-source.sha
          python3 -m unittest discover -s tests -p 'test_n447_rcash_evidence.py' -v             2>&1 | tee target/issue447-rcash/regressions.log
      - name: Build real node Docker image
        run: |
          set -euo pipefail
          tools/devnet.sh build 2>&1 | tee target/issue447-rcash/node-build.log
          docker image inspect rnode:local --format '{{.Id}}' > target/issue447-rcash/node-image.txt
      - name: Start disposable funded one-validator chain
        run: |
          set -euo pipefail
          tools/devnet.sh up --validators 1 --fresh --epoch-length 10             2>&1 | tee target/issue447-rcash/network-startup.log
      - name: Fetch exactly pinned external r-cash source
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --depth 1             https://github.com/PatrickMockridge/r-cash.git "$APP_DIR"
          git -C "$APP_DIR" fetch --depth 1 origin "$APP_COMMIT"
          git -C "$APP_DIR" checkout -q --detach "$APP_COMMIT"
          test "$(git -C "$APP_DIR" rev-parse HEAD)" = "$APP_COMMIT"
          git -C "$APP_DIR" rev-parse HEAD > target/issue447-rcash/rcash-source.sha
      - name: Build original r-cash CLI and contract corpus
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rcash-447-env"
          source "$RUNNER_TEMP/rcash-447-env/bin/activate"
          python3 -m pip install -q -r "$APP_DIR/harness/requirements.txt"
          cd "$APP_DIR"
          python3 tools/build_contracts.py
          cargo build --locked -p rcash-cli 2>&1 | tee "$GITHUB_WORKSPACE/target/issue447-rcash/rcash-build.log"
          python3 tools/keygen.py --out .testnet/keys.json --names admin1,admin2,admin3
          python3 tools/keygen.py --out .devnet/keys.json --names reporter1,reporter2,reporter3,admin1,admin2,admin3
      - name: Run verified dependency-by-dependency installer
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/rcash-447-env/bin/activate"
          cd "$APP_DIR"
