            start_code=$?
            if [ "$start_code" -eq 0 ]; then
              python3 tools/consensus-acceptance-drill.py --validators "$n" --window 180 --out "target/final-gap/n$n" > "target/final-gap/n$n-campaign.log" 2>&1
              code=$?
            else
              code=$start_code
            fi
            echo "n$n=$code" | tee -a target/final-gap/exit-codes.txt
            test "$code" -eq 0 || failed=1
            if [ "$start_code" -eq 0 ]; then
              python3 tests/consensus-partition-rejoin.py --validators "$n" --out "target/final-gap/n$n-partition" > "target/final-gap/n$n-partition-campaign.log" 2>&1
              partition_code=$?
              echo "n$n-partition=$partition_code" | tee -a target/final-gap/exit-codes.txt
              test "$partition_code" -eq 0 || failed=1
            fi
            for ((i=0;i<n;i++)); do
              node="acceptance-validator-$i"; [ "$i" -ne 0 ] || node=acceptance-bootstrap
              docker logs "$node" > "target/final-gap/n$n-$node.log" 2>&1 || true
              docker inspect "$node" > "target/final-gap/n$n-$node-inspect.json" 2>/dev/null || true
            done
            tools/devnet.sh down -v || true
          done
          exit "$failed"
      - name: Preserve all independent outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-gap-real-nodes-${{ github.run_id }}
          path: |
            target/final-gap/
            target/lfs-anchor-evidence/
            target/final-gap-image/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 7 || 14 }}
      - name: Teardown only disposable campaign networks
        if: always()
        run: |
          tools/devnet.sh down -v || true
          DEVNET_PREFIX=acceptance DEVNET_NETWORK=acceptance tools/devnet.sh down -v || true

  quiet-435-real-nodes:
