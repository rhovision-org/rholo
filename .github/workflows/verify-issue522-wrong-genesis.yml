name: Issue 522 — isolated wrong-genesis refusal

on:
  push:
    branches:
      - verify/issue522-wrong-genesis-20261031

permissions:
  contents: read

jobs:
  wrong-genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DEVNET_PREFIX: issue522badgenesis
      DEVNET_NETWORK: issue522badgenesis
      DEVNET_NODE_MEMORY: 2304m
      DEVNET_THREAD_POOL_SIZE: "2"
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Checkout exact dev source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d23c0b0e4b4c08bfa9609f7ca3a50ec96b1fd569
      - name: Pin source and verify disposable host capacity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue522-negative-wrong-genesis
          test "$(git rev-parse HEAD)" = d23c0b0e4b4c08bfa9609f7ca3a50ec96b1fd569
          git rev-parse HEAD | tee target/issue522-negative-wrong-genesis/source-sha.txt
          printf '%s\n' "${{ github.sha }}" > target/issue522-negative-wrong-genesis/driver-sha.txt
          free -h | tee target/issue522-negative-wrong-genesis/memory.txt
          df -h | tee target/issue522-negative-wrong-genesis/disk-before.txt
          test "$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)" -ge 14680064
          test "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" -ge 12582912
      - name: Build exact-source disposable node
        shell: bash
        run: |
          set -euo pipefail
          tools/devnet.sh build 2>&1 | tee target/issue522-negative-wrong-genesis/build.log
          docker run --rm --entrypoint sha256sum rnode:local /usr/local/bin/rnode | tee target/issue522-negative-wrong-genesis/binary-sha256.txt
      - name: Demand explicit refusal of deliberately wrong expected genesis
        shell: bash
        run: |
          set -euo pipefail
          output=target/issue522-negative-wrong-genesis
          # A deliberately impossible expectation for validator 1 only; the bootstrap
          # and other nodes use the normal generated genesis. No public hosts are used.
          export DEVNET_EXTRA_FLAGS_issue522badgenesis_validator_1="--expected-genesis-hash $(printf 'f%.0s' {1..64})"
          set +e
          timeout --signal=TERM --kill-after=10s 210s tools/devnet.sh up --validators 4 --fresh --autopropose --epoch-length 10 > "$output/boot-attempt.log" 2>&1
          rc=$?
          set -e
          echo "devnet_up_exit=$rc" | tee "$output/attempt-result.txt"
          docker logs issue522badgenesis-validator-1 > "$output/validator-1.log" 2>&1 || true
          docker logs issue522badgenesis-bootstrap > "$output/bootstrap.log" 2>&1 || true
          test "$rc" -ne 0 || { echo 'FAIL: wrong-genesis validator was accepted'; exit 1; }
          # Do not credit a timeout, capacity error or arbitrary bootstrap failure as
          # evidence of an actual genesis rejection. Require a clear node-side reason.
          grep -Eiq 'genesis.*(mismatch|does not match|different|invalid|refus|expected)|expected.genesis.*(mismatch|does not match|invalid|refus)' "$output/validator-1.log" || {
            echo 'INCONCLUSIVE: validator log lacks an explicit genesis-refusal reason'
            exit 1
          }
          curl -fsS --max-time 8 http://127.0.0.1:40403/health > "$output/bootstrap-health.json" || {
            echo 'INCONCLUSIVE: bootstrap is not independently healthy'
            exit 1
          }
          python3 - "$output/bootstrap-health.json" <<'PY'
          import json,sys
          health=json.load(open(sys.argv[1]))
          assert health.get('ready') is True, f'bootstrap not ready: {health}'
          PY
          if curl -fsS --max-time 5 http://127.0.0.1:41403/health > "$output/validator-1-health.json" 2>/dev/null; then
            python3 - "$output/validator-1-health.json" <<'PY'
          import json,sys
          health=json.load(open(sys.argv[1]))
          assert health.get('ready') is not True, f'bad-genesis validator unexpectedly ready: {health}'
          PY
          fi
          echo 'PASS: incorrect genesis was explicitly refused while bootstrap was healthy' | tee "$output/verdict.txt"
      - name: Preserve logs and diagnostics even on failure
        if: always()
        shell: bash
        run: |
          output=target/issue522-negative-wrong-genesis
          mkdir -p "$output"
          docker ps -a > "$output/docker-ps.txt" 2>/dev/null || true
          docker stats --no-stream > "$output/docker-stats.txt" 2>/dev/null || true
          for n in issue522badgenesis-bootstrap issue522badgenesis-validator-1 issue522badgenesis-validator-2 issue522badgenesis-validator-3; do
            docker inspect "$n" > "$output/$n-inspect.json" 2>/dev/null || true
            docker logs "$n" > "$output/$n-node.log" 2>&1 || true
          done
      - name: Retain reproducible negative witness
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue522-wrong-genesis-${{ github.run_id }}
          path: target/issue522-negative-wrong-genesis/
          retention-days: 90
          if-no-files-found: warn
      - name: Remove only the disposable negative-control network
        if: always()
        shell: bash
        run: tools/devnet.sh down -v || true
