name: Isolated N8 recovery verification

on:
  push:
    branches:
      - verify/isolated-recovery-20261030
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-n8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-controls:
    name: Fail-closed recovery harness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify isolated source and offline controls
        run: |
          set -euo pipefail
          mkdir -p target/isolated-recovery
          git rev-parse HEAD | tee target/isolated-recovery/source-sha.txt
          python3 -m unittest discover -s tests -p 'test_recovery_harness_controls.py' -v 2>&1 | tee target/isolated-recovery/harness-tests.log
          python3 -m py_compile tests/consensus-partition-rejoin.py tests/test_recovery_harness_controls.py
          git diff --check HEAD^ HEAD
      - name: Preserve control-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-recovery-controls-${{ github.run_id }}
          path: target/isolated-recovery/
          if-no-files-found: warn
          retention-days: 14

  n8-partition-rejoin:
    name: N8 isolated Docker partition/rejoin
    needs: harness-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEVNET_SKIP_JOINER_GRPC_PUBLISH: "1"
      DEVNET_NODE_MEMORY: "2g"
      DEVNET_THREAD_POOL_SIZE: "2"
      DEVNET_PREFIX: "acceptance"
      DEVNET_NETWORK: "acceptance"
      ACCEPTANCE_ARTIFACTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build source-pinned local node image
        run: |
          set -euo pipefail
          mkdir -p target/isolated-recovery
          git rev-parse HEAD | tee target/isolated-recovery/source-sha.txt
          free -h | tee target/isolated-recovery/runner-memory.txt
          tools/devnet.sh build 2>&1 | tee target/isolated-recovery/build.log
      - name: Execute N8 partition and rejoin without live-network access
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p target/isolated-recovery
          tools/devnet.sh up --validators 8 --fresh --no-autopropose --epoch-length 10 > target/isolated-recovery/n8-start.log 2>&1
          start_code=$?
          if [ "$start_code" -eq 0 ]; then
            python3 tests/consensus-partition-rejoin.py --validators 8 --out target/isolated-recovery/n8-partition > target/isolated-recovery/n8-campaign.log 2>&1
            campaign_code=$?
          else
            campaign_code=$start_code
          fi
          printf 'start=%s\npartition=%s\n' "$start_code" "$campaign_code" | tee target/isolated-recovery/exit-codes.txt
          docker ps -a > target/isolated-recovery/docker-ps.txt 2>&1 || true
          docker stats --no-stream > target/isolated-recovery/docker-stats.txt 2>&1 || true
          for i in $(seq 0 7); do
            node="acceptance-validator-$i"
            [ "$i" -ne 0 ] || node="acceptance-bootstrap"
            docker logs "$node" > "target/isolated-recovery/$node.log" 2>&1 || true
            docker inspect "$node" > "target/isolated-recovery/$node-inspect.json" 2>/dev/null || true
          done
          tools/devnet.sh down -v || true
          exit "$campaign_code"
      - name: Preserve N8 evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-n8-partition-${{ github.run_id }}
          path: target/isolated-recovery/
          if-no-files-found: warn
          retention-days: 14
