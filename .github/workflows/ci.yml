name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  partition-topology:
    name: Two-sided Docker partition topology (offline regressions)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert isolation, rollback, and negative controls
        run: python3 -m unittest discover -s tests -p 'test_n447_*.py' -v
      - name: Parse the full fork-point harness
        run: python3 -m py_compile tools/n420-fork-point.py tools/n447_partition.py

  quality:
    name: Formatting and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Existing port debt is explicit so every other rustc or Clippy warning is fatal.
      # Remove an allowance as soon as its last occurrence is fixed.
      #
      # `-A dead-code` was the list's first entry and is **gone** (2026-09-25): its last two
      # occurrences were a pairing helper in `casper/src/genesis/rgov.rs`'s test module and a block
      # fixture in `casper/src/reporting.rs`'s, neither called by any test — so they were also the
      # only two lines in the tree that no test could ever cover, and deleting them removed them from
      # the coverage denominator as well. Verified with the command below minus this flag.
      #
      # **Which entries are correctness-critical, and where they fire** (verified 2026-09-28 by
      # deleting each in turn and reading Clippy's output, not by grepping). `await-holding-lock`,
      # `bad-bit-mask` and `if-same-then-else` fire **only in `#[cfg(test)]` and `tests/` code**
      # (block-storage's and rholang's lib-tests). That is what this file has always said, and the
      # note is here because the September 2026 audit read the three as "no locatable site,
      # indistinguishable from stale allowances" — a search of *production* sources does not reach
      # test modules, which is where the sites are. The lesson is the audit's, not the list's.
      #
      # `-A clippy::non-canonical-partial-ord-impl` is **gone** (2026-09-28). Its last occurrence was
      # `AlwaysEqual`'s hand-written `partial_cmp` in `models/src/ast.rs`, now spelled
      # `Some(self.cmp(other))` — behaviourally identical, since both answer `Equal`, but canonical.
      # Verified with the command below minus this flag.
      #
      # `await-holding-lock`'s two **production** sites are also gone: `node/src/effects/repl_client.rs`
      # now clones the client out of the mutex rather than holding the guard across the tonic await.
      # The entry stays for the test-module sites above.
      CLIPPY_DEBT: >-
        -A clippy::await-holding-lock
        -A clippy::bad-bit-mask
        -A clippy::bool-comparison
        -A clippy::clone-on-copy
        -A clippy::cloned-ref-to-slice-refs
        -A clippy::collapsible-str-replace
        -A clippy::default-constructed-unit-structs
        -A clippy::derivable-impls
        -A clippy::doc-lazy-continuation
        -A clippy::enum-variant-names
        -A clippy::explicit-auto-deref
        -A clippy::identity-op
        -A clippy::if-same-then-else
        -A clippy::io-other-error
        -A clippy::items-after-test-module
        -A clippy::large-enum-variant
        -A clippy::manual-div-ceil
        -A clippy::manual-is-multiple-of
        -A clippy::map-identity
        -A clippy::module-inception
        -A clippy::needless-range-loop
        -A clippy::needless-borrow
        -A clippy::needless-return
        -A clippy::explicit-counter-loop
        -A clippy::new-ret-no-self
        -A clippy::new-without-default
        -A clippy::redundant-closure
        -A clippy::result-large-err
        -A clippy::should-implement-trait
        -A clippy::too-many-arguments
        -A clippy::type-complexity
        -A clippy::unnecessary-lazy-evaluations
        -A clippy::unnecessary-cast
        -A clippy::unnecessary-map-or
        -A clippy::unnecessary-sort-by
        -A clippy::unwrap-or-default
        -A clippy::while-let-loop
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup component add --toolchain 1.95.0 rustfmt clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings $CLIPPY_DEBT

      - name: Bench targets compile
        # `make bench-smoke`: **builds and links** every Criterion target in `rspace-bench` and runs
        # none of them. The clippy step above already *type-checks* them (`--all-targets` includes
        # benches), so what this adds is the build and link — the part a type-check cannot see — and it
        # is here because the benchmarks are otherwise only exercised by `make bench-scheduler`, which
        # peaks at ~6.5 GiB and is deliberately not a CI job (AUDIT C107).
        run: cargo bench -p rspace-bench --no-run

  test:
    name: Tests and the node's static gates
    runs-on: ubuntu-24.04
    # 45 minutes is the suite plus the two static gates with headroom for a cold cache.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$(cat rust-toolchain.toml | grep channel | cut -d'"' -f2)" --profile minimal
          rustup component add rustfmt clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Audit status
        # **First, before any gate.** The status is the answer to "what is left"; a run that prints a
        # wall of `ok` without it answers a question nobody had. `--quiet` keeps it to one line, and it
        # is also a check: it refuses a check-off that disagrees with the authored TSV.
        run: tools/audit-status.sh --quiet

      - name: Hard-fork tracker #51 closure guard (negative controls)
        # An open tracker stays open despite passing implementation CI.
        # This step checks the authored manifest and deliberately verifies
        # that the close command refuses the still-unresolved source.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_hardfork_51_closeout.py -v
          python3 tools/check-hardfork-51-closeout.py
          python3 -m unittest discover -s tests -p test_section6_inventory.py -v
          python3 tools/check-section6-inventory.py
          set +e
          python3 tools/check-hardfork-51-closeout.py --assert-closeable
          rc=$?
          set -e
          test "$rc" -eq 3

      - name: Decimal release evidence gate (synthetic refusal controls)
        # A successful input-consistency check still returns exit 3:
        # provenance and archive completeness require human review.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_decimal_release_preflight.py -v
          set +e
          python3 tools/decimal_release_preflight.py /tmp/pr391-no-release-evidence-present.json
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Type-system gate
        # The four **hard** classes only -- production `unwrap()`/`panic!`/`unsafe`, a silent fallible
        # conversion, a refinement surrendering its invariant. This is the one gate here that catches a
        # defect in the *node*, and it costs ~30 s. The counted classes were ratcheted against a
        # baseline file until 2026-09-27 and are not enforced any more: a number that fails the build
        # whenever it moves is a build step that has to be edited, not a check.
        run: tools/audit-type-system.sh

      - name: Vendored-source gate
        # The blessed contracts under `casper/src/genesis/resources/` are the **oracle's own source
        # text**, vendored and compiled in with `include_str!`, so an edit to one is a specification
        # change wearing a comment's clothes. Seconds, and it guards the spec rather than a document
        # about the spec.
        run: tools/audit-vendored-sources.sh

      - name: Workflow-pin gate
        # A `uses:` that names a tag or a branch is a dependency whose content can change after review,
        # and a workflow with no top-level `permissions:` gets a token that is broader than the job
        # needs. Neither is visible in review, because both look like ordinary YAML. Seconds, and this
        # is the check issue #91 owed — the pinning and the permission blocks were already right in
        # every workflow; nothing refused a regression.
        run: tools/check-workflow-pins.sh

      - name: Conflict-marker gate
        # Git's markers are ordinary text to everything that is not git, so a conflict that survived a
        # rebase reads as a document saying two things at once — it happened here, in
        # `spec/audit/passes.md`, through the whole formal gate and into `dev` on 2026-10-02. Every
        # other check in this job reads a *structured* file, which is exactly why prose was unguarded.
        # Seconds, and it is the check that would have refused that merge.
        run: tools/check-no-conflict-markers.sh

      - name: Ingress-queue bound gate
        # Every queue on the ingress -> validate -> process path must be bounded, because a peer streams
        # valid-signed blocks into it and an unbounded hop lets that peer fill memory faster than the
        # node drains it. The defect this guards (AUDIT C175) was invisible in review — an
        # `unbounded_channel()` beside a `channel(N)` reads as ordinary wiring — and the check is a
        # **source** check rather than a test because the fact is in the type: a unit test could only
        # assert the boundedness by failing to compile against the signature, and a test that does not
        # compile is not a test. It is the check C175 closes on, so it belongs in the job that fails
        # when it regresses rather than in the tree waiting to be run.
        run: tools/check-bounded-ingress-queues.sh --gate

      - name: Spawn-observability gate
        # A detached task whose `JoinHandle` is dropped stops with no line anywhere, and the node then
        # serves with that subsystem gone (AUDIT C254). The six sites the audit named are supervised;
        # what a fix at six sites does not do is stop the seventh, so this lists every detached task on
        # the ingress path as supervised, held, or bare-with-a-reason, and fails on a new bare one.
        # The fact is in the shape of the call — whether the handle is kept — which is why it is a
        # source check beside the queue bound rather than a test.
        run: tools/check-spawn-observability.sh --gate

      - name: Cost register gate
        # The "flat charge for superlinear work" defect has been found twice — the 2026-09 union dedup
        # and the 2026-10 conversions, union asymmetry and `censure` — both times by measurement,
        # because nothing in the tree could see a charge that does not track its work. This is the
        # census over the charge sites: every arm of the reducer's dispatch has a row saying what it
        # charges and for what shape, an arm with no row fails, a row for nothing fails, and a declared
        # charge that is not in the arm it claims fails. The half that *measures* the charge is
        # `rholang/tests/cost_shapes.rs`, which the workspace test step above runs.
        run: |
          python3 tools/check-cost-register.py
          tools/emit-cost-register.sh --check
          python3 -m unittest discover -s tests -p test_cost_register.py -v

      - name: Review-ledger coverage gate
        # The audit's own limit statement — `all N T1 modules read`, printed by `audit-status.sh` and
        # rendered into `AUDIT.md` — is a claim about *modules that can fork the chain or lose funds*,
        # and nothing checked it after its checker (`audit-test-register.sh`, 78 s) was deleted
        # 2026-09-27. Behind that deletion the census went stale: `tool` had drifted from 23 rows to 27
        # with nothing refusing it, and 62 tracked `.rs` files carry no row at all. This is the cheap
        # half of the old join — the ceilings against their rows, and every T1 row against the tree —
        # and it deliberately *reports* the roster gap rather than gating on it, because a gate that can
        # only be satisfied by adding bookkeeping rows is the thing it exists to avoid.
        run: tools/check-review-ledger.sh --gate

      - name: Hazop-worksheet gate
        # `docs/src/spec/failure-hazop.md` claims something about *itself*: that every one of the ten
        # study nodes dispositions all eleven IEC guide words, and that every deviation row carries a
        # decided rung (R1–R4) and a falsifier. A claim about a document is checked by reading the
        # document, so this is the same shape as the review-ledger gate above. It refuses an empty
        # cell, a rung left as "R1/R2", a falsifier naming a test that does not exist *or* a symbol
        # that does not occur in the file it names, and a debt count that disagrees with the page —
        # because a number nothing checks is a number that rots.
        run: tools/check-hazop-worksheet.sh --gate

      - name: Resource safety case gate
        # The resource safety case is a claim about a document: every hazard names a threat, a
        # barrier, a consequence, a residual and evidence; no row claims a pass. `owed:` is counted
        # debt until the programme's units land, and `--require-evidence` is the completion gate.
        run: tools/check-resource-safety-case.sh --gate

      - name: Artefact-producing build paths are pin-locked and unparameterised
        # Two wargame rows name a gate rather than a test, and neither existed: `every build path
        # passes --locked` (the lock file is a promise the build has to keep) and `the shipped
        # artefact is not parameterised by build args` (a build argument that reaches `cargo`
        # compiles a different binary, so the definition a release is produced from must not accept
        # one). `tools/check-build-paths.sh` checks both, and the profiling Dockerfile — the one
        # that *is* allowed to parameterise — is checked to still be --locked, so the exemption is
        # for the args and not for the pin.
        run: tools/check-build-paths.sh --gate

      - name: The wargame section's completeness claim
        # **Written in #348 and never called by anything until now.** `docs/src/spec/adversary.md`
        # claims something about *itself* — that every study node dispositions all eleven guide words,
        # that every Table A row carries a decided verdict, a persona and a falsifier, and that the
        # referee's calibration is declared — and `tools/check-wargame.sh` is the check that reads the
        # document and refuses when the page and the claim disagree. It had no caller: not here, not in
        # `tools/todo.sh`, not in another gate. A check that exists and is obeyed by nothing is the
        # class this repository's own fuzz work named — a report nothing acts on — and the wargame table
        # is where the remediation's rows come from, so a table that drifts is a table nobody re-reads.
        run: tools/check-wargame.sh --gate

      - name: Reducer wasm32 check
        # Issue #98: the reducer must stay compilable for `wasm32-unknown-unknown` — the in-browser
        # ZFA endgame, where every room member runs the reducer with RSpace behind a host-provided
        # storage trait. A **check** is the right gate: it is the compile boundary, it is cheap, and
        # it refuses a regression (a new `getrandom` route, a `std` clock) without needing a wasm
        # runtime in CI. The failures it catches are not visible on the host, because the host
        # toolchain never selects these backends.
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p rchain-rspace --target wasm32-unknown-unknown
          cargo check -p rchain-rholang --target wasm32-unknown-unknown

      - name: Reducer wasm32 tests
        # Issue #98's second half: a *check* only pins the compile boundary, and the target's real
        # failures are runtime ones — `getrandom` with no backend, `std`'s clock, `spawn_blocking` on a
        # threadless target. These tests run on `wasm32-unknown-unknown` under node and would have
        # caught each. The CLI version is read from `Cargo.lock`, not written here, because
        # `wasm-bindgen-cli` refuses to run when it disagrees with the `wasm-bindgen` crate.
        run: |
          WB=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | awk -F'"' '/version/{print $2}')
          cargo install wasm-bindgen-cli --version "$WB" --locked
          cargo test -p rchain-crypto --test wasm_law19 --target wasm32-unknown-unknown
          cargo test -p rchain-rspace --test wasm_roundtrip --target wasm32-unknown-unknown
          cargo test -p rchain-rholang --test wasm_reduce --target wasm32-unknown-unknown

      - name: Test
        run: cargo test --workspace --all-features

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: false

      # **A source install, not the Docker action this job used to run** (2026-10-09). That action is a
      # container action: every run pulled `rust:1.85.0-alpine3.20` from Docker Hub anonymously, and the
      # runner fleet's shared anonymous pull quota is not ours to rely on — it exhausted on 2026-10-09
      # and the job failed at *image resolve* (`429 Too Many Requests … toomanyrequests`), before the
      # repository was even checked out, on a pull request that changed no dependencies. The audit
      # itself is unchanged; `cargo-deny` is the same tool at the version that action pinned
      # (`deny_version="0.20.2"` in its Dockerfile), and `cache-bin` (on by default) keeps the install
      # from being rebuilt on every run.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Audit Rust dependencies
        # `check` and not `check advisories` (AUDIT F-12). The narrower command ran only the
        # RustSec advisory check, which left every other policy in `deny.toml` — the copyleft
        # allow-list most of all — as dead letter: a licence, a banned crate or an unexpected
        # source could arrive unnoticed. Running the whole policy immediately found `foldhash`'s
        # Zlib, which had been reaching the tree unlisted; that is now allowed by name, with its
        # reason, in `deny.toml`.
        run: cargo deny check

      - name: emSign exception rejects unpatched root providers
        run: python3 tools/check-emsign-dependency-policy.py

  docs:
    name: Documentation book
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mdbook
        run: cargo install --locked mdbook --version 0.5.4

      - name: Documentation structure, links and anchors
        run: tools/check-docs-links.sh --gate

      - name: Artifact figures match the record
        run: tools/recount-artifact.sh --check

      - name: Law counts match the register
        run: tools/emit-lean-counts.sh --check

      - name: Build the book
        run: mdbook build docs
