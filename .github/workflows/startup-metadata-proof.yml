name: Startup metadata proof

on:
  pull_request:
    branches: [dev]
    paths:
      - 'casper/src/block_metadata_store.rs'
      - 'block-storage/src/dag/metadata_store.rs'
      - 'casper/tests/startup_metadata_bench.rs'
      - 'tools/startup-metadata-proof.py'
      - 'spec/audit/evidence/n480-startup-metadata-20261029/**'
      - '.github/workflows/startup-metadata-proof.yml'

permissions:
  contents: read

concurrency:
  group: startup-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paired-constructor:
    name: Mature-history constructor parity and peak RSS
    if: github.event.pull_request.number == 480
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install pinned Rust and fixture import tools
        run: |
          rustup show active-toolchain
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev lmdb-utils
      - name: Run paired production constructors against the pinned public metadata
        run: python3 tools/startup-metadata-proof.py --out "$RUNNER_TEMP/startup-metadata-proof" --pairs 7
      - name: Retain raw trials, build logs, binaries and source provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: startup-metadata-proof-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/startup-metadata-proof/results.json
            ${{ runner.temp }}/startup-metadata-proof/*.json
            ${{ runner.temp }}/startup-metadata-proof/*.jsonl
            ${{ runner.temp }}/startup-metadata-proof/*.log
            ${{ runner.temp }}/startup-metadata-proof/constructor-*
          retention-days: 30
          if-no-files-found: error
