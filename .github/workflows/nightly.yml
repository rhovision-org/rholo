# The deep gates, moved off the push path.
#
# Every one of these is a cross-check whose cost is measured in tens of minutes, and none of them is
# evidence for a Rust change:
#
#   * `check-lean-conformance.sh` is **~104 serial `cargo test` invocations** (15 corpus layers + 89
#     witness entries) behind a Lean build that is 16 minutes cold and a Coq `make`;
#   * `cargo llvm-cov` recompiles the whole workspace with source-based instrumentation — a codegen
#     profile of its own, so none of the warm `test` cache is reused — and then runs the full suite.
#
# The instrument harness was the third and is gone (2026-09-27): it planted a defect per gate and ran
# the whole gate 23 times, which tests the *apparatus*. Two of the gates it exercised have since been
# deleted, and the two that remain are exercised by `ci.yml` on every push.
#
# They move here rather than disappearing. Nothing is dropped from the evidence; it stops gating every
# push and starts being measured on a schedule. What stays per-push is what finishes in minutes and can
# actually fail: `cargo fmt --check`, clippy, `cargo test --workspace` *uninstrumented*, and the two
# static audit gates — all of which are steps of the existing workflows, not of this one.
name: Nightly deep gates

on:
  schedule:
    # An off-the-hour minute deliberately: scheduled jobs across GitHub land on :00, and the queue is
    # why a nightly started on the hour can finish long after it.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  # Least privilege, stated rather than defaulted (AUDIT C137).
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formal:
    # The oracle is the mathematical specification (`AGENTS.md`'s *Prime directive*), and until this
    # job existed nothing built it: no workflow touched `spec/`, so a theorem that stopped holding, a
    # module that fell out of the library, or a Coq file that never compiled was noticed by no one.
    # This is the gate that makes the specification *checked* rather than *cited*.
    #
    # `tools/check-lean-conformance.sh` is the single entry point: it builds the Lean library, refuses
    # a `sorry`, requires `Rchain.lean` to import every module, builds the Coq, re-emits the
    # conformance corpora from the Lean definitions and refuses a stale one, runs the Rust consumers
    # 1:1 against them, and runs the static protocol/channel-balance audits.
    name: Formal specification (Lean, Coq, conformance)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Coq
        # Bounded for the same reason as the per-PR job's: an `apt-get` stall on a runner otherwise
        # holds the job until its timeout, which reads as a slow build (see formal-on-change.yml).
        run: sudo timeout 300 apt-get update && sudo timeout 900 apt-get install --no-install-recommends -y coq

      - name: Install protobuf compiler
        run: sudo timeout 300 apt-get update && sudo timeout 900 apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: false

      - name: Install elan (the Lean toolchain comes from spec/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib cache
        working-directory: spec
        run: lake exe cache get

      - name: Formal gate
        run: tools/check-lean-conformance.sh

      - name: Diagnose the formal step
        # The step is intermittently SIGTERM'd before it can print its own failure
        # (issue #417). The sampler and build log are on the runner; print them
        # where the next reader can see them.
        if: failure()
        run: |
          echo '--- memory ---'; free -m || true
          echo '--- top processes ---'; ps -eo pid,rss,pcpu,comm --sort=-rss | head -12 || true
          echo '--- lean build tail ---'; tail -n 120 /tmp/lean-build.log || true
          echo '--- memory sampler tail ---'; tail -n 200 /tmp/lean-memory.log || true

      - name: Record the formal gate memory
        # A passing run also needs the peak and the available memory: #417's
        # residual is the 14.2 GB isolated peak against the runner's 16 GB.
        if: always()
        run: |
          echo '--- memory after the gate ---'; free -m || true
          echo '--- peak RSS sample ---'
          grep -E '^[[:space:]]*[0-9]+[[:space:]]+[0-9]+' /tmp/lean-memory.log 2>/dev/null | sort -k2 -nr | head -3 || true
          echo '--- sampler tail ---'; tail -n 40 /tmp/lean-memory.log || true

  coverage:
    name: Coverage measurement and floor
    runs-on: ubuntu-latest
    # **This job had no ceiling at all** until now. `llvm-cov` over the whole workspace is the single
    # longest thing this repository runs, and an unbounded job is one that can hold a runner for hours
    # without anyone being told. 90 minutes is roughly the measured cost plus headroom for a cold
    # cache; a run that exceeds it is a regression worth seeing rather than a run worth waiting for.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6db3a280da9eee4283c045c7431ab5116f1a0089 # cargo-llvm-cov

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Coverage
        # The measurement, the per-file ranking and the floor are emitted to `spec/COVERAGE-LEDGER.md`
        # by `tools/emit-coverage-ledger.sh`. The floor is a regression tripwire, not a target: it is
        # raised only *after* measuring.
        #
        # **The rule used to be checked and is not any more.** `floor = floor(measured) - 2` was
        # recomputed from the committed lcov by check 11 of `tools/audit-test-register.sh`, which was
        # deleted on 2026-09-27 with the rest of that gate. The rule still describes how the numbers
        # below were arrived at, and re-running `make coverage` is what reconciles them.
        #
        # The line and function floors, and why the second is a *function* floor (AUDIT C107): the
        # audit's item asked for `--branch`, and the toolchain refuses it (`-Z coverage-options=branch`
        # on the pinned 1.95.0), so the closest instrument available is function coverage.
        #
        # Measurement history, written without the sign as a record: 73.68 => 71 (Stages 0-2),
        # 79.69 => 77 (Stages 3-4), 81.30 => 79 (the low-coverage sweep), 84.07 => 82 (the census
        # sweep), 86.77 => 84 (the coverage pass: the emitted ledger, and the node's read surface
        # pinned route by route), 87.22 => 85 (the same pass, after its first batches: the
        # `eval_method` arms and refusal tables, the http system process, the gateway carrier),
        # 87.60 => 85 (autopropose, the message variants, the number-channel refusals),
        # 87.95 => 85 (the merge's entry point, the deploy service's delegations),
        # 88.02 => 86 (the export traversal's second level, proposeResult's arms),
        # 88.62 => 86 (the merge's block index, NodeRunning's dispatch),
        # 88.87 => 86 (the codecs' decode halves, the UPnP device report, the normalizer refusals),
        # 89.14 => 87 (the reporting replay and its system deploy, the OpenAPI document).
        #
        # **This step moved here from `coverage.yml` when the deep gates left the push path**, and it
        # took the floors and this history with it. That file was *reduced* to on-demand measurement
        # rather than deleted — it still exists, and carries its own account of why — while what it did
        # per push (format, lints, the tests, the two static gates) is `ci.yml`'s now.
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --fail-under-lines 87 --fail-under-functions 80

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  docs-figures:
    name: Artifact record freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Re-measure the tracked tree against the committed record
        run: tools/recount-artifact.sh --verify-live --no-binary

