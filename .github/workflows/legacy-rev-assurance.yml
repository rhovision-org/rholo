  n4-evidence-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Offline synthetic evidence falsification controls
        working-directory: spec/audit/legacy-rev-assurance
        run: |
          set -o pipefail
          python3 test_verify_n4_evidence.py 2>&1 | tee n4-evidence-controls.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n4-offline-evidence-controls
          path: spec/audit/legacy-rev-assurance/n4-evidence-controls.txt
