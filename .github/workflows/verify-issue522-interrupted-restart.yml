name: Issue 522 — interrupted restart negative witness

on:
  push:
    branches:
      - verify/issue522-interrupted-restart-20261031

permissions:
  contents: read

jobs:
  interrupted-n4:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      DEVNET_PREFIX: issue522interrupt
      DEVNET_NETWORK: issue522interrupt
      DEVNET_NODE_MEMORY: 2304m
      DEVNET_THREAD_POOL_SIZE: "2"
      CARGO_BUILD_JOBS: "4"
      SOURCE_SHA: d23c0b0e4b4c08bfa9609f7ca3a50ec96b1fd569
    steps:
      - name: Checkout exact source plus verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Pin runtime source and resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue522-interrupted
          printf '%s\n' "${{ github.sha }}" > target/issue522-interrupted/driver-sha.txt
          printf '%s\n' "$SOURCE_SHA" > target/issue522-interrupted/source-sha.txt
          free -h | tee target/issue522-interrupted/memory.txt
          test "$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)" -ge 14680064
          test "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" -ge 12582912
          python3 -m py_compile tests/issue522_interrupted_restart.py
          git diff --check HEAD^ HEAD
      - name: Build from pinned dev, not verification driver
        shell: bash
        run: |
          set -euo pipefail
          # Keep the verification script outside the checkout before switching source.
          cp tests/issue522_interrupted_restart.py /tmp/issue522-interrupted-restart.py
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          tools/devnet.sh build 2>&1 | tee target/issue522-interrupted/build.log
          docker run --rm --entrypoint sha256sum rnode:local /usr/local/bin/rnode | tee target/issue522-interrupted/binary-sha256.txt
      - name: Boot four isolated validators
        shell: bash
        run: |
          set -euo pipefail
          tools/devnet.sh up --validators 4 --fresh --autopropose --epoch-length 10 2>&1 | tee target/issue522-interrupted/boot.log
      - name: Interrupt a restart and require durable recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/issue522-interrupted-restart.py target/issue522-interrupted 2>&1 | tee target/issue522-interrupted/drill.log
      - name: Capture even failed evidence
        if: always()
        shell: bash
        run: |
          output=target/issue522-interrupted
          mkdir -p "$output"
          docker ps -a > "$output/docker-ps.txt" 2>/dev/null || true
          docker stats --no-stream > "$output/docker-stats.txt" 2>/dev/null || true
          for n in issue522interrupt-bootstrap issue522interrupt-validator-1 issue522interrupt-validator-2 issue522interrupt-validator-3; do
            docker inspect "$n" > "$output/$n-inspect.json" 2>/dev/null || true
            docker logs "$n" > "$output/$n-node.log" 2>&1 || true
          done
      - name: Retain negative-control artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue522-interrupted-${{ github.run_id }}
          path: target/issue522-interrupted/
          retention-days: 90
          if-no-files-found: warn
      - name: Remove the disposable network and volumes
        if: always()
        shell: bash
        run: tools/devnet.sh down -v || true
