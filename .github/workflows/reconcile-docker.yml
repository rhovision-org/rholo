name: Reconciliation Docker regression
on:
  pull_request:
    paths:
      - "tools/reconcile-network.sh"
      - "tests/reconcile-docker-lifecycle.sh"
      - "tests/reconcile-regression.py"
      - "tests/reconcile-cache-regression.py"
      - "tests/reconcile-target-guard.py"
      - "tests/reconcile-enumeration-regression.sh"
      - "tests/reconcile-systemd-restore-regression.sh"
      - ".github/workflows/reconcile-docker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-lifecycle:
    name: Docker recovery lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run deterministic reconciliation regressions
        run: python3 tests/reconcile-regression.py
      - name: Verify range snapshots across recovery and finality progress
        run: python3 tests/reconcile-cache-regression.py
      - name: Check live target inventory guard
        run: python3 tests/reconcile-target-guard.py
      - name: Verify node enumeration and audit bounds offline
        run: bash tests/reconcile-enumeration-regression.sh
      - name: Verify the systemd restore stages before swap
        run: bash tests/reconcile-systemd-restore-regression.sh
      - name: Verify Docker engine
        run: docker info
      - name: Exercise recovery on disposable Docker resources
        run: bash tests/reconcile-docker-lifecycle.sh
