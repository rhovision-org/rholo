[package]
name = "rchain-rholang"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful and hardened Rust port of the RChain rholang interpreter (core: Env, Substitute, matcher, accounting, Reduce)."

[dependencies]
async-trait = "0.1"
num-bigint = "0.5"
num-traits = "0.2"
qucalc = { path = "../qucalc" }
rchain-models = { path = "../models" }
rchain-crypto = { path = "../crypto" }
rchain-rspace = { path = "../rspace" }
rchain-sdk = { path = "../sdk" }
rchain-shared = { path = "../shared" }

# The reducer's tokio use is `spawn`/`JoinSet` on the current-thread runtime (`reduce.rs`), which is
# `rt`. `rt-multi-thread` is **rejected on `wasm32-unknown-unknown`** — tokio's own
# `compile_error!` names the supported set (sync, macros, io-util, rt, time) — and needs OS threads
# the target does not have, so it is host-only (issue #98). The multi-thread runtime is used only by
# tests, which run on the host.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `sync` for the `oneshot` the spawn seam returns its result over; `wasm-bindgen-futures` is the
# host executor `spawn_reduce_task` hands the reduction future to (there is no tokio runtime on the
# target — see `reduce.rs`).
tokio = { version = "1", features = ["rt", "sync"] }
wasm-bindgen-futures = "0.4"

# Host-only test infrastructure: `proptest` pulls `wait-timeout`, which is native-only, and the test
# runtime is the multi-thread executor the target rejects. Scoping them to the host keeps the wasm
# test target buildable (issue #98).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.proptest]
# The property sweep (Laws 3/5). Already in `Cargo.lock` — a dev-dependency addition.
version = "1"

# The wasm-target harness for `tests/wasm_reduce.rs` — a full reduction, parsed and executed, on the
# target that has no runtime of its own (issue #98).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
